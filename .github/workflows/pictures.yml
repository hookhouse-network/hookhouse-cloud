name: pictures
# In-house picture farm (owner 18 Nov: "use in house image and video generators ... less depending upon third party",
# "all the processes should be done on cloude"). Our own FLUX.1-schnell Q4 (Apache 2.0, second-state GGUF) with
# stable-diffusion.cpp (MIT) on the cloud machines; no third-party picture quota, no PC.
# Speed test 18 Nov (4-core runner): 512x640 in 600 s, 768x1024 in 1405 s. A fast SD 1.5 LCM model was tried and
# dropped: it cannot draw line art.
# Each machine takes a different unfinished book (engine/cloud/book_farm.py) and saves every page to the private store.
on:
  schedule:
    - cron: "15 */6 * * *"             # every 6 hours; a run stops itself after ~5.5 h
  workflow_dispatch:
    inputs:
      minutes:
        description: "drawing minutes per machine"
        default: "320"
      only:
        description: "only these machines, e.g. [0,3] (a rescue run beside the running one)"
        default: ""

concurrency:
  group: farm-${{ inputs.only || 'all' }}
  cancel-in-progress: false

jobs:
  farm:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.only || '[0, 1, 2, 3, 4, 5, 6, 7]') }}
    env:
      HOOKHOUSE_CLOUD: "1"
      STATE_KEY: ${{ secrets.STATE_KEY }}
      STORE_REPO: ${{ vars.STORE_REPO }}
      STORE_TOKEN: ${{ secrets.STORE_TOKEN }}
      HOOKHOUSE_ENV: ${{ secrets.HOOKHOUSE_ENV }}
      SD_DIR: /home/runner/sd
      FLUX_DIR: /home/runner/models
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Image engine (stable-diffusion.cpp, MIT)
        run: |
          mkdir -p ~/sd && cd ~/sd
          curl -sSL -o sd.zip https://github.com/leejet/stable-diffusion.cpp/releases/download/master-1106-532d2c1/sd-master-532d2c1-bin-Linux-Ubuntu-26.04-x86_64.zip
          unzip -q sd.zip && chmod +x sd-cli sd-server
      - name: Model cache
        uses: actions/cache@v4
        with:
          path: ~/models
          key: flux-schnell-q4-8c45a2b
      - name: Model (FLUX.1-schnell GGUF, Apache 2.0)
        run: |
          mkdir -p ~/models && cd ~/models
          for f in flux1-schnell-Q4_0.gguf ae-f16.gguf clip_l-Q8_0.gguf t5xxl-Q4_0.gguf; do
            [ -s "$f" ] || curl -sSL -o "$f" "https://huggingface.co/second-state/FLUX.1-schnell-GGUF/resolve/8c45a2ba25e2d02bd34230989fb54983f39e44ec/$f"
          done
      - name: Map data (public domain - US Census, Natural Earth)
        run: |
          mkdir -p data/geo/us_states data/geo/world_ind
          curl -sSL -o /tmp/us.zip https://www2.census.gov/geo/tiger/GENZ2023/shp/cb_2023_us_state_20m.zip && unzip -qo /tmp/us.zip -d data/geo/us_states || true
          curl -sSL -o /tmp/w.zip https://naciscdn.org/naturalearth/10m/cultural/ne_10m_admin_0_countries_ind.zip && unzip -qo /tmp/w.zip -d data/geo/world_ind || true
      - name: Draw book pages
        run: python cli.py cloud farm --shard ${{ matrix.shard }} --of 8 --budget ${{ inputs.minutes || '320' }}
