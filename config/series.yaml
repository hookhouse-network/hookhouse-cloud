# Named series per story channel (plan P3r creativity workstream, standard S8 A13: "1-2 named series per channel").
# A series makes every video feel like an episode of a show people come back for (binge + brand recall). Each video of
# a channel is written as an episode of one of its series, in rotation (engine/series.py):
#   promise  = what every episode delivers (the writer keeps it: angle, structure, payoff)
#   hashtag  = first hashtag of the episode (description, tags, Reel caption): one series, one tag
#   long videos get the series name as a title prefix when it fits; Shorts keep a search-first title (hook first)
# Playlists per series follow later (A4). Edit freely: the writer reads this file every time.

unsolved_after_dark:
  - {name: "Cold Case Files", promise: "a real unsolved case and the one clue that never fit", hashtag: "#ColdCaseFiles"}
  - {name: "Vanished", promise: "a real person or place that disappeared without a trace, and the theories that still divide people", hashtag: "#Vanished"}
