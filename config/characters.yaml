# Original human friends for Bloop & Friends (plan P3r characters workstream; owner 21 Nov: "instead of just shapes,
# we can introduce some humans, animals, real world stuff").
# Faces: ToonHead by Johan Melin (CC BY 4.0), made with DiceBear (MIT code); licence read from the package metadata
# and checked at every generation (engine/media/characters.py). Every option is FIXED so a character looks the same in
# every video. Bodies, arms, legs and all motion are drawn by our own code (engine/media/puppet.py).
# Colours are hex without '#'. Voices: Kokoro-82M (Apache-2.0); a voice missing on the PC downloads on first use.
credit: "Characters' faces: ToonHead by Johan Melin (CC BY 4.0), made with DiceBear."

