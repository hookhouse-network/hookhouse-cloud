# Content gate rules (engine/content_gate.py). Owner, 20 Nov 2026: "make the system's policies, quality control,
# verifications and validations strictest as much as possible"; "nothing should bypass these gates, and these gates
# for whole system contents, rules and policies are according to channel, platform and content based".
#
# Every upload passes publish.upload_item, which runs the gate for each platform first; the approval path runs it
# before anything reaches the owner. Missing data = blocked (fail closed). Add a platform / content type / channel
# here, not in code. Platform numbers are the platforms' own API limits (checked 20 Nov 2026).

defaults:
  min_quality: 100            # owner: "each video must be 100/100, no compromise" (engine/quality.py scorecard)
  fact_check: required        # required | if_present | off
  ai_disclosure: required     # AI voice/pictures -> Meta "AI info" / YouTube synthetic flag must be set
  auto_redo_max: 2            # quality below the bar -> remade with the gate's notes, at most this many times

content:                      # by channel type
  story:    {fact_check: required}
  brainrot: {fact_check: if_present, ai_disclosure: if_used}   # 21 Nov: our own physics engine, no AI unless a voice is used
  kids:     {fact_check: off, made_for_kids: required, ai_disclosure: off}
  clips:    {fact_check: off, ai_disclosure: off, clip_gate: required}

platforms:
  youtube:     {short_max_s: 180, title_max: 100, description_max: 5000}
  instagram:   {min_s: 3, max_s: 900, caption_max: 2200, hashtags_max: 5}
  facebook:    {min_s: 3, max_s: 90, caption_max: 2200}
  threads:     {caption_max: 500}
  dailymotion: {max_s: 3600}
  telegram:    {max_mb: 48}

temporary_bar:                # owner 21 Nov ("Temporary 85 bar"): 0 of 53 posts went out in 24 h under 100/100.
  until: "2026-11-28"         # last day it applies (IST); then the strict bars below come back by themselves
  min_quality: 85             # quality score; 'bad' issues still block, only small craft warnings may remain
  min_each: 8                 # potential rubric per criterion (9 normally)
  # policy, copyright/franchise, fact-check, kids-safety, AI-label and clip/campaign checks are NOT relaxed

potential:                    # engine/potential_gate.py: the "viral + earning" half of 100/100
  min_each: 9                 # every rubric criterion 9+/10 (9 = top 5 % of the niche this month)
  hook_start_max_s: 0.6       # narration/caption must start within 0.6 s (viewed vs swiped away)
  clip_hook_start_max_s: 1.0
  title_repeat_ratio: 0.85    # a title this similar to an earlier one of the channel = not original
  rubrics: {}                 # override per content type, e.g. story: [hook, retention, emotion, ...]

auto_approve:                 # engine/auto_approve.py (owner 20 Nov: "yes you can consider auto-approval")
  enabled: true
  # owner 21 Nov: "approving cards ... this is your part of job not mine, automation must handle this also":
  # every video that passes ALL gates is approved by the system; the owner keeps "❌ Stop it" as a veto.
  min_clean: 0                # was 10 owner approvals per channel + kind before the system could approve
  min_hours: 0.25             # was 2 h: campaign clips and late-made videos must not wait for a tap
  exclude_channels: []

channels: {}                # per-channel overrides, e.g.  brain_snack: {min_quality: 100, fact_check: required}
