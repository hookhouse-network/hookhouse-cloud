spec: {short_words: "125-150 words (about 45-55 seconds)", short_wpm: 170, long_wpm: 168, shot_s: 2.3, hook_shot_s: 1.3, long_words: "2100-3000 words (12-17 minutes)", long_shot_s: 3.5}
topic_style: "Formats that win in wildlife (niche_playbooks_2026-11-11.md): one animal's unbelievable ability with proof, 'Top 5 animals that...', comparisons, surprising behaviour; famous animals (axolotl, capybara, honey badger, tardigrade, Komodo, platypus, shoebill). No gore, no cruelty."
