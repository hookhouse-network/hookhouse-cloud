about: "Every ending explained. Every secret found. Movie endings, hidden details and the stories behind famous films, explained in minutes. Original commentary, no studio clips."
keywords: ["movie endings explained", "movie explained", "hidden details", "film theories", "movie facts"]
handles: {"youtube": "@EndingDecodedHQ", "youtube_backup": "@EndingDecodedHQ", "instagram": "endingdecodedhq", "instagram_backup": "ending.decoded"}
