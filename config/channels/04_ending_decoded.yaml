# Research targets (owner, 11 Nov: 'follow your research'). Source: movie_bollywood_explainers.md format A: 55-75 s, ~180 wpm (af_heart x1.10), new visual every 1.2-2.0 s
spec: {short_words: "160-200 words (about 55-68 seconds)", short_wpm: 180, long_wpm: 180, shot_s: 1.6, hook_shot_s: 1.2, long_words: "1600-2100 words (8-12 minutes)", long_shot_s: 3.0}
caption: {font: "Bebas Neue", pop: true}   # movie spec A: Bebas Neue/Anton 88-96 px, keyword pop 1.0-1.15-1.0
writer_rules: "Movie spec: beat 1 is a verdict or contradiction in 8-12 words; label any speculation as a theory; never present anything as official."
