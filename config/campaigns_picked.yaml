# Campaigns the owner picked by link (owner 19-20 Nov: "join gta 6 campaigns and start clipping"). The cloud tick puts
# each one in the campaign database (cr_footage.ensure_config_campaigns); campaigns with `kick:` get their footage
# from the streamer's Kick clips via Kick's own Download button (engine/kick.py, PC browser signed in to Kick).
# Twitch / YouTube-only campaigns (Kai Cenat, LACY, Clix, TOMO) are joined but NOT listed: no permitted way to get
# their footage (Twitch: only the streamer can download; YouTube: no download), so nothing to clip.
campaigns:
  - id: dasgasd3m-x-ruckus-gta-6     # same id as the board copy (ClippingAlpha) so there is one record
    name: "Dasgasd3m x RUCKUS | GTA 6"
    url: https://contentrewards.com/c/campaigns/051002dd-5c46-43d0-a446-43f2957ba3a9
    source: contentrewards
    status: joined                   # joined 19 Nov (scripts.cr_join_check)
    joined: "2026-11-19"             # gate: clips must be made after joining (joined_at)
    account: stream_clips            # the GTA channel (brief: a GTA 6-specific YouTube Shorts / TikTok account)
    platforms: [youtube]             # brief: TikTok or YouTube Shorts only (TikTok is not available in India)
    kick: dasgasd3m
    game: "Grand Theft Auto VI"
    footage_since: "2026-11-18"      # brief: his 18 Nov GTA 6 stream or later; older clips are style references only
    deadline: "2026-12-19"
    length_seconds: {min: 30, max: 60}   # brief: 20-60 s, keep setup + reaction + payoff; owner 20 Nov: 20 s is too short
    onscreen_tag: "dasgasd3m on Kick"    # brief: credit on screen, readable on a phone (whole clip)
    headline_box: true                   # the best Dasgas Shorts: white headline band on the seam, whole clip
    end_text: "Watch live: kick.com/dasgasd3m"   # brief: "End: send viewers to his stream"
    required_tags: ["#dasgasdom3"]
    required_text: ["Credit: dasgasd3m on Kick. Watch live: kick.com/dasgasd3m"]   # caption gate adds it
    submit_within_min: 30            # brief: submit the public post link while it is under 30 minutes old
    hook_ideas: ["Dasgas Dom reacts to ...", "Dasgas Dom finds a GTA 6 glitch", "Dasgas Dom fails ..."]
    rules: >-
      Keep Dom's face or voice; keep setup, reaction and payoff; readable captions, clear audio; no explicit
      material; never fabricate his voice, reactions, chat or gameplay; no spoilers in the cover; no gambling
      (Stake) promos in the clip.
