# Global settings for the whole system.
# Times are India time (IST). Edit and save — no code changes needed.

timezone: Asia/Kolkata

# Phase 1 shared truth (engine/core/d1.py): sqlite = local ledger only; dual = the cloud also mirrors every ledger
# row to the Worker's LedgerDO (SQLite stays authoritative). Cloud runner only. Set back to sqlite to switch it off.
ledger_backend: dual
# Phase 1 last step (21 Nov): the Telegram bot's working keys (upd:/cmd:/res:/dec:/meta:) leave KV (1,000 free writes
# a day) for the LedgerDO. kv = as before; dual = write both, read KV; do = the DO first. Move together with the
# Worker's TELE_STORE var (cloud/worker/wrangler.toml).
tele_store: do
# Phase 2 scheduler (cloud/worker/scheduler.js in the LedgerDO): off | shadow (workers heartbeat and build the 7-day
# presence history; the PC still claims through the old claim files) | on (claims come from the shared queue).
scheduler: "on"             # 26 Nov: on (owner: complete the plan as soon as possible); queue order = the PC's, an empty answer falls back to the claim files; "shadow" to undo
data_story: "on"            # P3b 28 Nov (on after a test: quality 93, judge avg 6.7, human_feel 6): lets channels with data_story: true make their Short with charts (compare/timeline/scale/depth/map) when the free pictures are used up; "off" undoes

# P3r (owner 21 Nov): picture-free formats rendered by HyperFrames on the PC (Brain Snack "colorsort" first).
# Only machines with HyperFrames installed pick them; set false to switch them off everywhere.
hyperframes_formats: true
# 24 Nov S6 (the 23 Nov 21:00 review of Brain Snack): the character battles ("Coco vs Mochi: who wins?") got 189
# Instagram views, 0.09x the channel's median, 0 likes, and a viewer called the fight unfair; the review: stop them.
# History fast-facts got 2,050-2,790 views. Remove a format from this list to bring it back.
snack_retired_formats: [versus]
# Legends told as legends (engine/legends.py, 24 Nov): one checker call per script finds legends stated as history
# (only what the sources themselves call a legend) and marks each episode once ("legend says", "कहते हैं"), or frames
# a whole folk tale once. Human-story channels always; other channels when listed here (or channels: all). The 24 Nov
# measurement: right on the Hindi folk/legend drafts, wrong on English fact Shorts (hypotheses and documented facts
# called legends), so no fact channel is listed. enabled: false switches it off everywhere.
legend_check: {enabled: true, channels: []}

# P3r characters (owner 21 Nov: "introduce some humans"): human friends (config/characters.yaml) join the kids Shorts
# where their faces can be made (DiceBear + browser, the PC). Set false for the toon friends only.
kids_puppets: true

# AI pictures (Cloudflare FLUX.1-schnell, free 10,000 neurons/day). 23 Nov, from Cloudflare's own usage records: the
# step price is charged PER TILE, so a 1024x1024 picture costs 4 tiles x (4.8 + steps x 9.6): 4 steps = 172.8 neurons
# (~57 pictures/day), not 58 as first read from the pricing docs. Schnell is distilled for 1-4 steps (Cloudflare's
# default is 4). 22 Nov: story videos ran out of pictures every day.
flux_steps: 4
# Fresh topics (owner 23 Nov: "too old trending topics"): every planned story slot made in the next window_h hours
# is offered that day's on-brand trends once (engine/fresh_topics.py); enabled: false keeps the weekly topics.
fresh_topics: {enabled: true, window_h: 36}
# Cloudflare picture models, best first (engine/storyboard.py CF_CATALOG): klein = FLUX.2 [klein] 4B (Apache 2.0, a
# 576x1024 picture in the Short's own shape for ~104 neurons, ~96 a day); flux = FLUX.1-schnell (a 1024x1024 square
# for 172.8 neurons, ~57 a day). 23 Nov 15:20: klein first after the side-by-side check on 6 real beats
# (checker average 8.0 vs 7.3 for the cropped schnell picture, no letters; results in docs/plan_status.yaml);
# [flux] switches back.
cf_picture_models: [klein, flux]

# Local pictures on the PC when the cloud ones are used up (owner 20 Nov: "SD1.5-family models only as a fallback,
# idle + plugged in, low priority, capped, benchmarked first"; engine/media/local_sd.py). 22 Nov: Cloudflare retired
# its two unbilled picture models on 20 Nov. DreamShaper 8 LCM (CreativeML OpenRAIL-M) via stable-diffusion.cpp on
# the CPU: ~2 minutes a picture at below-normal priority (benchmark in local_sd.py). A video starts on them only
# after idle_min minutes without keyboard/mouse; max_day pictures a day. enabled: false switches it off.
# Owner 23 Nov: "120 yes" (was 60, ~2 h of CPU; the PC sat idle every afternoon once both picture sources were used).
local_pictures: {enabled: true, max_day: 120, idle_min: 3, threads: 6, steps: 4, timeout_s: 600}

# P3 script judge (22 Nov): the potential gate's rubric on the script BEFORE voice, pictures and render; below the bar
# the script is rewritten with the judge's fixes (up to `rounds` times) and the best draft is kept. Since the strict
# judge went live no video passed it (story Shorts 5-7 of 10 vs 8), each after ~12 pictures and ~35 minutes.
script_judge: {enabled: true, rounds: 2}

# Best posting times per audience (IST). US slots = US daytime/evening.
posting_slots:
  US: ["22:30", "23:45", "05:00", "06:30"]
  IN: ["12:30", "19:00", "21:00"]

campaigns:
  auto_stop_budget_pct: 30        # stop making clips when less than this % budget is left
  budget_reminder_days: 2         # ask you to update budgets every N days
  min_cpm_usd: 0.5                # ignore campaigns paying less than this per 1,000 views
  home_country: IN                # used for the "India verdict"

# The AI brain. Each task tries providers in order; if one fails or hits its
# free limit, the next one is used automatically.
brain:
  routes:
    # owner 15 Nov: tonight's render failed when Gemini's daily limit ran out and Groq refused one big request.
    # Each model below has its OWN free limit, so the chain is long: Gemini 3 models, Groq 2 models, then backups.
    # 23 Nov: 30 of 58 scripts since 20 Nov were written by Flash-Lite, because the writer route reaches it 4th while
    # gemini-3.6/3.7-flash (their own free quotas) sat 7th/8th unused, and 20 small writing jobs (titles, trims,
    # storyboard shots, rewrites) use the same route. The main script (story.write_script) has its own route:
    # every full model before any Lite one. The small jobs keep the writer route.
    script:   [gemini37, gemini36, gemini35, gemini, gemini3, groq, cerebras, github, gemini_lite, gemini31_lite, gemini35_lite, groq20, gemma31, gemma26, groq_qwen, nvidia, openrouter, cf_oss, cf_llama, claude_cli]
    writer:   [gemini, gemini35, groq, gemini_lite, groq20, gemini3, gemini36, gemini37, gemini31_lite, gemini35_lite, gemma31, gemma26, groq_qwen, cerebras, github, nvidia, openrouter, cf_oss, cf_llama, claude_cli]   # scripts, hooks, titles
    editor:   [gemini, gemini35, groq, gemini_lite, groq20, gemini3, gemini36, gemini37, gemini31_lite, gemini35_lite, gemma31, gemma26, groq_qwen, cerebras, github, nvidia, openrouter, cf_oss, cf_llama, claude_cli]   # picks clip moments
    checker:  [groq, gemini_lite, gemini35, groq20, gemini, gemini3, gemini36, gemini37, gemini31_lite, gemini35_lite, gemma31, gemma26, groq_qwen, cerebras, github, nvidia, openrouter, cf_oss, cf_llama, claude_cli]   # rules / fact checks
    manager:  [gemini, gemini35, groq, gemini_lite, groq20, gemini3, gemini36, gemini37, gemini31_lite, gemini35_lite, gemma31, gemma26, groq_qwen, cerebras, github, nvidia, openrouter, cf_oss, cf_llama, claude_cli]   # daily review
    reader:   [groq, gemini_lite, gemini35, groq20, gemini, gemini3, gemini36, gemini37, gemini31_lite, gemini35_lite, gemma31, gemma26, groq_qwen, cerebras, github, nvidia, openrouter, cf_oss, cf_llama, claude_cli]   # campaign pages
  providers:
    gemini:
      kind: gemini
      model: gemini-flash-latest
      key_env: GEMINI_API_KEY
    gemini35:
      kind: gemini
      model: gemini-3.5-flash
      key_env: GEMINI_API_KEY
    gemini_lite:
      kind: gemini
      model: gemini-flash-lite-latest
      key_env: GEMINI_API_KEY
    groq20:
      kind: openai_compatible
      base_url: https://api.groq.com/openai/v1
      model: openai/gpt-oss-20b
      key_env: GROQ_API_KEY
    groq:
      kind: openai_compatible
      base_url: https://api.groq.com/openai/v1
      model: openai/gpt-oss-120b
      key_env: GROQ_API_KEY
    nvidia:
      kind: openai_compatible
      base_url: https://integrate.api.nvidia.com/v1
      model: meta/llama-3.3-70b-instruct
      key_env: NVIDIA_API_KEY
    openrouter:
      kind: openai_compatible
      base_url: https://openrouter.ai/api/v1
      model: meta-llama/llama-3.3-70b-instruct:free
      key_env: OPENROUTER_API_KEY
    # 17 Nov: each free model has its OWN daily limit; 14 channels ran Gemini/Groq dry, so every free model our
    # two keys can reach is listed (tested: answered or 'busy'; 2.5 models are closed to new users)
    gemini3:
      kind: gemini
      model: gemini-3-flash-preview
      key_env: GEMINI_API_KEY
    gemini36:
      kind: gemini
      model: gemini-3.6-flash
      key_env: GEMINI_API_KEY
    gemini37:
      kind: gemini
      model: gemini-3.7-flash
      key_env: GEMINI_API_KEY
    gemini31_lite:
      kind: gemini
      model: gemini-3.1-flash-lite
      key_env: GEMINI_API_KEY
    gemini35_lite:
      kind: gemini
      model: gemini-3.5-flash-lite
      key_env: GEMINI_API_KEY
    gemma31:
      kind: gemini
      model: gemma-4-31b-it
      key_env: GEMINI_API_KEY
    gemma26:
      kind: gemini
      model: gemma-4-26b-a4b-it
      key_env: GEMINI_API_KEY
    groq_qwen:
      kind: openai_compatible
      base_url: https://api.groq.com/openai/v1
      model: qwen/qwen3.8-27b
      key_env: GROQ_API_KEY
    # 19 Nov: Cloudflare Workers AI (our existing Cloudflare account; free 10,000 neurons/day, no card, commercial
    # use allowed; gpt-oss Apache-2.0, Llama 3.3 community licence). Plans stalled on "every model resting".
    # LAST in every route: the same 10,000 daily neurons draw the storyboard pictures (~10 Shorts a day), and
    # pictures are the scarcer resource. These only stop a video failing when every other model rests.
    cf_oss:
      kind: openai_compatible
      base_url: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1
      model: "@cf/openai/gpt-oss-120b"
      key_env: CLOUDFLARE_API_TOKEN
    cf_llama:
      kind: openai_compatible
      base_url: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1
      model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
      key_env: CLOUDFLARE_API_TOKEN
    # 24 Nov vetting: Cerebras's open free tier ended in 2026; its $5 trial now needs a payment method (owner rule: no
    # card, even for free tiers), so no key is requested. The entry stays harmless ("no key") until that changes.
    cerebras:                   # Cerebras free tier: big daily allowance, no card (17 Nov; outdated, see above)
      kind: openai_compatible
      base_url: https://api.cerebras.ai/v1
      model: gpt-oss-120b
      key_env: CEREBRAS_API_KEY
    github:                     # GitHub Models, free with the repo's own token (cloud jobs only; 17 Nov: Gemini
      kind: openai_compatible   # and Groq daily limits ran out across 14 channels)
      base_url: https://models.github.ai/inference
      model: openai/gpt-4.1-mini
      key_env: GITHUB_MODELS_TOKEN
    claude_cli:
      kind: claude_cli          # only used on your PC during building/testing
      enabled_env: USE_CLAUDE_CLI
  cooldown_minutes:
    rate_limit: 2               # "too many requests per minute"
    daily_quota: 720            # "out of free quota for today" (12 hours)
    error: 5
    timeout: 1                  # a slow answer (long scripts): try again soon
    busy: 1                     # 503 "high demand": try again in a minute

memory:
  # Multilingual (English + Hindi) embedding model; runs on a normal CPU.
  embedding_model: intfloat/multilingual-e5-small
  db_path: data/memory.db

database:
  path: data/system.db
