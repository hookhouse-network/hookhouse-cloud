# One-time re-plans the cloud runs once each (by id), e.g. after a channel changes type or niche: its slots in the
# current and next week's plans are planned again; every other channel's slots stay as they are.
requests:
  - id: "2026-11-20-stream-clips-gta"          # owner 19-20 Nov: Stream Clips = GTA & gaming facts (story format)
    channels: [stream_clips]
  - id: "2026-11-20-gta-clips-campaign-design"  # owner 20 Nov: clips too short / not per the brief's reference Shorts
    redo: [1121_0100_stream_clips_short, 1121_0500_stream_clips_short, 1121_0630_stream_clips_short]
    note: "remake: 30-60 s, headline band, Kick outro cut (campaign design)"
  - id: "2026-11-20-gta-clips-muted"            # the remakes were held for profanity before muting existed
    redo: [1121_0100_stream_clips_short, 1121_0500_stream_clips_short, 1121_0630_stream_clips_short]
    note: "remake: swear words muted; footage the gate holds is skipped"
  - id: "2026-11-25-hot-take-letterbox"         # blocked at upload every tick: made before the letterbox crop (5d81147)
    redo: [1122_0500_hot_take_hq_clip]
    note: "remake: black bars cropped before reframing"
  - id: "2026-11-25-gta-clips-opening"          # judge held them: hook 3.5 / caption_hook 2.5 (nothing in the first 2 s)
    redo: [1121_0100_stream_clips_short, 1121_0500_stream_clips_short, 1121_0630_stream_clips_short]
    note: "remake: opens with a 1.5 s payoff teaser, game subtitles blurred, captions below the Kick badge"
  - id: "2026-11-25-gta-clips-speech-first"     # all 3 held only for 'speech starts at 1.6-4.9s' (the flash had no words)
    redo: [1121_0100_stream_clips_short, 1121_0500_stream_clips_short, 1121_0630_stream_clips_short]
    note: "remake: the payoff flash starts on the streamer's line (991e2dc)"
  - id: "2026-11-26-gta-clips-shown"            # held by the judge (caption_hook 2-3): it read only the captions
    redo: [1121_0100_stream_clips_short, 1121_0500_stream_clips_short, 1121_0630_stream_clips_short]
    note: "remake: the clip record says what it shows (layout, headline, payoff flash, frames); silent payoffs flash the reaction"
