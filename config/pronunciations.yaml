# How our voices should say words they get wrong (engine/media/say.py; used by every channel's narration).
# en: the English voice (Kokoro). Value in /slashes/ = phonemes in Kokoro's own symbols (check with
#     python cli.py say "text"); a plain value = the words to read instead.
# hi: the Hindi voice. Value = the words to read instead (Devanagari).
# Add a line whenever a video says a name wrong; it fixes every future video on every channel.
