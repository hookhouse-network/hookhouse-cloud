<!doctype html>
<!-- Our own animated chart scenes (compare bars, timeline, size circles), drawn on a canvas. Inspired by the
     "explainer" animations in yihui-dev/awesome-opus5-5-videos (code-written animation rendered to video); written
     from scratch. html_scene.py fills DATA and calls window.draw(t) once per video frame, so output is exact. -->
<html><head><meta charset="utf-8">
<style>
/*FONTS*/
html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
canvas { display: block; }
</style></head>
<body><canvas id="c"></canvas>
<script>
const DATA = /*DATA*/{};
const W = DATA.width, H = DATA.height, T = DATA.seconds;
const cv = document.getElementById("c");
cv.width = W; cv.height = H;
const g = cv.getContext("2d");
const TH = DATA.theme;
const S = Math.min(W, H) / 1080;            // scale: 1 at 1080 px on the short side
const PORTRAIT = H > W;

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeBack = x => { x = clamp(x); const c = 1.7; return Math.max(0, 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2)); };
const seg = (t, a, b) => clamp((t - a) / (b - a));

function font(px, family) { return `${Math.round(px)}px "${family}"`; }

function fitText(text, family, maxW, px, minPx) {
  g.font = font(px, family);
  while (px > minPx && g.measureText(text).width > maxW) { px -= 2; g.font = font(px, family); }
  return px;
}

// "$85.3M" counted to p: the first number grows, the rest of the text stays (the spoken form)
function counted(text, p) {
  const m = String(text).match(/\d[\d,]*(\.\d+)?/);
  if (!m || p >= 1) return String(text);
  const raw = m[0], val = parseFloat(raw.replace(/,/g, "")), dec = (m[1] || "").length - (m[1] ? 1 : 0);
  let cur = (val * p).toFixed(Math.max(0, dec));
  if (raw.includes(",")) cur = Number(cur).toLocaleString("en-US", { minimumFractionDigits: Math.max(0, dec), maximumFractionDigits: Math.max(0, dec) });
  return String(text).replace(raw, cur);
}

function background(t) {
  const grd = g.createRadialGradient(W / 2, H * 0.42, 10, W / 2, H * 0.5, Math.max(W, H) * 0.75);
  grd.addColorStop(0, TH.bg2); grd.addColorStop(1, TH.bg);
  g.fillStyle = grd; g.fillRect(0, 0, W, H);
  // slow drifting light band keeps the frame alive while the chart holds
  const x = (t / T) * W * 1.4 - W * 0.2;
  const band = g.createLinearGradient(x - W * 0.4, 0, x + W * 0.4, H);
  band.addColorStop(0, "rgba(255,255,255,0)"); band.addColorStop(0.5, TH.sheen); band.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = band; g.fillRect(0, 0, W, H);
  // fine grain (seeded by frame: same input, same picture)
  const n = Math.floor(t * 30);
  g.fillStyle = TH.grain;
  for (let i = 0; i < 900; i++) {
    const r = Math.sin((i + 1) * 12.9898 + n * 78.233) * 43758.5453;
    const q = Math.sin((i + 7) * 39.3468 + n * 11.135) * 24634.6345;
    g.fillRect((r - Math.floor(r)) * W, (q - Math.floor(q)) * H, 2 * S, 2 * S);
  }
}

function title(t) {
  if (!DATA.title) return 0;
  const a = easeOut(seg(t, 0.05, 0.45));
  const px = fitText(DATA.title, TH.title_font, W * 0.86, 92 * S, 44 * S);
  g.globalAlpha = a; g.fillStyle = TH.ink; g.textAlign = "center"; g.textBaseline = "alphabetic";
  const y = (PORTRAIT ? H * 0.2 : H * 0.17) + (1 - a) * 30 * S;
  g.font = font(px, TH.title_font); g.fillText(DATA.title, W / 2, y);
  g.fillStyle = TH.accent; const lw = W * 0.12 * a;
  g.fillRect(W / 2 - lw / 2, y + 22 * S, lw, 8 * S);
  g.globalAlpha = 1;
  return y + 40 * S;
}

function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

function compare(t, top) {
  const items = DATA.items, n = items.length;
  const max = Math.max(...items.map(i => i.value));
  const big = items.findIndex(i => i.value === max);
  const area = { x: W * 0.1, w: W * 0.8, y0: top + (PORTRAIT ? H * 0.08 : H * 0.06), y1: PORTRAIT ? H * 0.78 : H * 0.8 };
  const gap = area.w * (n > 2 ? 0.08 : 0.14), bw = (area.w - gap * (n - 1)) / n;
  for (let k = 0; k < n; k++) {
    const it = items[k], start = 0.35 + k * 0.28, p = easeOut(seg(t, start, start + 1.0));
    const fullH = (area.y1 - area.y0 - 170 * S) * (it.value / max);
    const h = Math.max(6 * S, fullH * p), x = area.x + k * (bw + gap), y = area.y1 - h;
    g.fillStyle = k === big ? TH.accent : TH.muted;
    roundRect(x, y, bw, h, 18 * S); g.fill();
    g.fillStyle = "rgba(255,255,255,0.10)"; roundRect(x, y, bw * 0.18, h, 18 * S); g.fill();
    const vp = fitText(counted(it.text, p), TH.num_font, bw * 1.15, 104 * S, 40 * S);
    g.globalAlpha = clamp(p * 3); g.fillStyle = k === big ? TH.accent_ink : TH.ink; g.textAlign = "center";
    g.font = font(vp, TH.num_font); g.fillText(counted(it.text, p), x + bw / 2, y - 26 * S);
    const lp = fitText(it.label, TH.label_font, bw * 1.15, 54 * S, 26 * S);
    g.fillStyle = TH.ink; g.font = font(lp, TH.label_font); g.fillText(it.label, x + bw / 2, area.y1 + 70 * S);
    g.globalAlpha = 1;
  }
  g.fillStyle = TH.rule; g.fillRect(area.x - 10 * S, area.y1, area.w + 20 * S, 4 * S);
}

function timeline(t, top) {
  const items = DATA.items, n = items.length;
  const draw = easeOut(seg(t, 0.2, 0.2 + 0.45 * n));
  g.strokeStyle = TH.rule; g.lineWidth = 6 * S; g.lineCap = "round";
  if (PORTRAIT) {
    const x = W * 0.22, y0 = top + H * 0.06, y1 = H * 0.86, step = (y1 - y0) / Math.max(1, n - 1);
    g.beginPath(); g.moveTo(x, y0); g.lineTo(x, y0 + (y1 - y0) * draw); g.stroke();
    for (let k = 0; k < n; k++) {
      const it = items[k], at = 0.35 + k * 0.45, p = easeBack(seg(t, at, at + 0.45)), a = clamp(seg(t, at, at + 0.3));
      const y = y0 + step * k, last = k === n - 1;
      g.fillStyle = last ? TH.accent : TH.ink;
      g.beginPath(); g.arc(x, y, Math.max(0, 22 * S * p), 0, Math.PI * 2); g.fill();
      g.globalAlpha = a; g.textAlign = "left";
      const lp = fitText(it.label, TH.num_font, W * 0.62, 96 * S, 40 * S);
      g.fillStyle = last ? TH.accent : TH.ink; g.font = font(lp, TH.num_font);
      g.fillText(it.label, x + 60 * S + (1 - a) * 40 * S, y + 10 * S);
      if (it.text) {
        const tp = fitText(it.text, TH.label_font, W * 0.62, 50 * S, 26 * S);
        g.fillStyle = TH.ink2; g.font = font(tp, TH.label_font);
        g.fillText(it.text, x + 60 * S + (1 - a) * 40 * S, y + 72 * S);
      }
      g.globalAlpha = 1;
    }
  } else {
    const y = H * 0.55, x0 = W * 0.1, x1 = W * 0.9, step = (x1 - x0) / Math.max(1, n - 1);
    g.beginPath(); g.moveTo(x0, y); g.lineTo(x0 + (x1 - x0) * draw, y); g.stroke();
    for (let k = 0; k < n; k++) {
      const it = items[k], at = 0.35 + k * 0.45, p = easeBack(seg(t, at, at + 0.45)), a = clamp(seg(t, at, at + 0.3));
      const x = x0 + step * k, last = k === n - 1;
      g.fillStyle = last ? TH.accent : TH.ink;
      g.beginPath(); g.arc(x, y, Math.max(0, 20 * S * p), 0, Math.PI * 2); g.fill();
      g.globalAlpha = a; g.textAlign = "center";
      const lp = fitText(it.label, TH.num_font, step * 0.95, 84 * S, 36 * S);
      g.fillStyle = last ? TH.accent : TH.ink; g.font = font(lp, TH.num_font);
      g.fillText(it.label, x, y - 50 * S - (1 - a) * 30 * S);
      if (it.text) {
        const tp = fitText(it.text, TH.label_font, step * 0.95, 44 * S, 22 * S);
        g.fillStyle = TH.ink2; g.font = font(tp, TH.label_font); g.fillText(it.text, x, y + 90 * S);
      }
      g.globalAlpha = 1;
    }
  }
}

function scale(t, top) {
  const items = DATA.items, n = items.length;
  const max = Math.max(...items.map(i => i.value));
  const yTop = top + 130 * S, yBot = (PORTRAIT ? H * 0.88 : H * 0.92) - 100 * S;   // room for value + label text
  const cy = (yTop + yBot) / 2;
  const total = items.reduce((s, i) => s + i.value, 0);
  const unit = Math.min((W * 0.84 - (n - 1) * 40 * S) / total, (yBot - yTop) / max);   // true to scale, fits
  let x = W / 2 - (total * unit + (n - 1) * 40 * S) / 2;
  for (let k = 0; k < n; k++) {
    const it = items[k], at = 0.35 + k * 0.55, p = easeBack(seg(t, at, at + 0.7)), a = clamp(seg(t, at, at + 0.4));
    const d = Math.max(8 * S, it.value * unit), r = d / 2 * p, cx = x + d / 2, big = it.value === max;
    const grd = g.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.1, cx, cy, Math.max(r, 1));
    grd.addColorStop(0, big ? TH.accent2 : TH.muted2); grd.addColorStop(1, big ? TH.accent : TH.muted);
    g.fillStyle = grd; g.beginPath(); g.arc(cx, cy, Math.max(r, 0.5), 0, Math.PI * 2); g.fill();
    g.globalAlpha = a; g.textAlign = "center"; g.fillStyle = TH.ink;
    const lp = fitText(it.label, TH.label_font, Math.max(d, 220 * S), 54 * S, 26 * S);
    g.font = font(lp, TH.label_font); g.fillText(it.label, cx, cy + d / 2 + 70 * S);
    if (it.text) {
      const tp = fitText(it.text, TH.num_font, Math.max(d, 240 * S), 84 * S, 34 * S);
      g.fillStyle = big ? TH.accent_ink : TH.ink; g.font = font(tp, TH.num_font);
      g.fillText(counted(it.text, a), cx, cy - d / 2 - 30 * S);
    }
    g.globalAlpha = 1;
    x += d + 40 * S;
  }
}

window.draw = function (t) {
  const zoom = 1 + 0.025 * (t / T);                           // slow push-in, like a camera
  g.setTransform(zoom, 0, 0, zoom, -(zoom - 1) * W / 2, -(zoom - 1) * H / 2);
  background(t);
  const top = title(t);
  ({ compare, timeline, scale })[DATA.type](t, top || H * 0.12);
  g.setTransform(1, 0, 0, 1, 0, 0);
  return true;
};
window.ready = document.fonts.ready.then(() => { window.draw(0); return true; });
</script></body></html>
