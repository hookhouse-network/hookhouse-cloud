<!doctype html>
<!-- Our own animated chart scenes (compare bars, timeline, size circles), drawn on a canvas. Inspired by the
     "explainer" animations in yihui-dev/awesome-opus5-5-videos (code-written animation rendered to video); written
     from scratch. html_scene.py fills DATA and calls window.draw(t) once per video frame, so output is exact. -->
<html><head><meta charset="utf-8">
<style>
/*FONTS*/
html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
canvas { display: block; }
</style></head>
<body><canvas id="c"></canvas>
<script>
const DATA = /*DATA*/{};
const W = DATA.width, H = DATA.height, T = DATA.seconds;
const cv = document.getElementById("c");
cv.width = W; cv.height = H;
const g = cv.getContext("2d");
const TH = DATA.theme;
const S = Math.min(W, H) / 1080;            // scale: 1 at 1080 px on the short side
const PORTRAIT = H > W;

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeBack = x => { x = clamp(x); const c = 1.7; return Math.max(0, 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2)); };
const seg = (t, a, b) => clamp((t - a) / (b - a));

function font(px, family) { return `${Math.round(px)}px "${family}"`; }

function fitText(text, family, maxW, px, minPx) {
  g.font = font(px, family);
  while (px > minPx && g.measureText(text).width > maxW) { px -= 2; g.font = font(px, family); }
  return px;
}

// "$85.3M" counted to p: the first number grows, the rest of the text stays (the spoken form)
function counted(text, p) {
  const m = String(text).match(/\d[\d,]*(\.\d+)?/);
  if (!m || p >= 1) return String(text);
  const raw = m[0], val = parseFloat(raw.replace(/,/g, "")), dec = (m[1] || "").length - (m[1] ? 1 : 0);
  let cur = (val * p).toFixed(Math.max(0, dec));
  if (raw.includes(",")) cur = Number(cur).toLocaleString("en-US", { minimumFractionDigits: Math.max(0, dec), maximumFractionDigits: Math.max(0, dec) });
  return String(text).replace(raw, cur);
}

function background(t) {
  const grd = g.createRadialGradient(W / 2, H * 0.42, 10, W / 2, H * 0.5, Math.max(W, H) * 0.75);
  grd.addColorStop(0, TH.bg2); grd.addColorStop(1, TH.bg);
  g.fillStyle = grd; g.fillRect(0, 0, W, H);
  // slow drifting light band keeps the frame alive while the chart holds
  const x = (t / T) * W * 1.4 - W * 0.2;
  const band = g.createLinearGradient(x - W * 0.4, 0, x + W * 0.4, H);
  band.addColorStop(0, "rgba(255,255,255,0)"); band.addColorStop(0.5, TH.sheen); band.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = band; g.fillRect(0, 0, W, H);
  // fine grain (seeded by frame: same input, same picture)
  const n = Math.floor(t * 30);
  g.fillStyle = TH.grain;
  for (let i = 0; i < 900; i++) {
    const r = Math.sin((i + 1) * 12.9898 + n * 78.233) * 43758.5453;
    const q = Math.sin((i + 7) * 39.3468 + n * 11.135) * 24634.6345;
    g.fillRect((r - Math.floor(r)) * W, (q - Math.floor(q)) * H, 2 * S, 2 * S);
  }
}

function title(t) {
  if (!DATA.title) return 0;
  const a = easeOut(seg(t, 0.05, 0.45));
  const px = fitText(DATA.title, TH.title_font, W * 0.86, 92 * S, 44 * S);
  g.globalAlpha = a; g.fillStyle = TH.ink; g.textAlign = "center"; g.textBaseline = "alphabetic";
  const y = (PORTRAIT ? H * 0.2 : H * 0.17) + (1 - a) * 30 * S;
  g.font = font(px, TH.title_font); g.fillText(DATA.title, W / 2, y);
  g.fillStyle = TH.accent; const lw = W * 0.12 * a;
  g.fillRect(W / 2 - lw / 2, y + 22 * S, lw, 8 * S);
  g.globalAlpha = 1;
  return y + 40 * S;
}

function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

function compare(t, top) {
  const items = DATA.items, n = items.length;
  const max = Math.max(...items.map(i => i.value));
  const big = items.findIndex(i => i.value === max);
  const area = { x: W * 0.1, w: W * 0.8, y0: top + (PORTRAIT ? H * 0.08 : H * 0.06), y1: PORTRAIT ? H * 0.78 : H * 0.8 };
  const gap = area.w * (n > 2 ? 0.08 : 0.14), bw = (area.w - gap * (n - 1)) / n;
  for (let k = 0; k < n; k++) {
    const it = items[k], start = 0.35 + k * 0.28, p = easeOut(seg(t, start, start + 1.0));
    const fullH = (area.y1 - area.y0 - 170 * S) * (it.value / max);
    const h = Math.max(6 * S, fullH * p), x = area.x + k * (bw + gap), y = area.y1 - h;
    g.fillStyle = k === big ? TH.accent : TH.muted;
    roundRect(x, y, bw, h, 18 * S); g.fill();
    g.fillStyle = "rgba(255,255,255,0.10)"; roundRect(x, y, bw * 0.18, h, 18 * S); g.fill();
    const vp = fitText(counted(it.text, p), TH.num_font, bw * 1.15, 104 * S, 40 * S);
    g.globalAlpha = clamp(p * 3); g.fillStyle = k === big ? TH.accent_ink : TH.ink; g.textAlign = "center";
    g.font = font(vp, TH.num_font); g.fillText(counted(it.text, p), x + bw / 2, y - 26 * S);
    const lp = fitText(it.label, TH.label_font, bw * 1.15, 54 * S, 26 * S);
    g.fillStyle = TH.ink; g.font = font(lp, TH.label_font); g.fillText(it.label, x + bw / 2, area.y1 + 70 * S);
    g.globalAlpha = 1;
  }
  g.fillStyle = TH.rule; g.fillRect(area.x - 10 * S, area.y1, area.w + 20 * S, 4 * S);
}

function timeline(t, top) {
  const items = DATA.items, n = items.length;
  const draw = easeOut(seg(t, 0.2, 0.2 + 0.45 * n));
  g.strokeStyle = TH.rule; g.lineWidth = 6 * S; g.lineCap = "round";
  if (PORTRAIT) {
    const x = W * 0.22, y0 = top + H * 0.06, y1 = H * 0.86, step = (y1 - y0) / Math.max(1, n - 1);
    g.beginPath(); g.moveTo(x, y0); g.lineTo(x, y0 + (y1 - y0) * draw); g.stroke();
    for (let k = 0; k < n; k++) {
      const it = items[k], at = 0.35 + k * 0.45, p = easeBack(seg(t, at, at + 0.45)), a = clamp(seg(t, at, at + 0.3));
      const y = y0 + step * k, last = k === n - 1;
      g.fillStyle = last ? TH.accent : TH.ink;
      g.beginPath(); g.arc(x, y, Math.max(0, 22 * S * p), 0, Math.PI * 2); g.fill();
      g.globalAlpha = a; g.textAlign = "left";
      const lp = fitText(it.label, TH.num_font, W * 0.62, 96 * S, 40 * S);
      g.fillStyle = last ? TH.accent : TH.ink; g.font = font(lp, TH.num_font);
      g.fillText(it.label, x + 60 * S + (1 - a) * 40 * S, y + 10 * S);
      if (it.text) {
        const tp = fitText(it.text, TH.label_font, W * 0.62, 50 * S, 26 * S);
        g.fillStyle = TH.ink2; g.font = font(tp, TH.label_font);
        g.fillText(it.text, x + 60 * S + (1 - a) * 40 * S, y + 72 * S);
      }
      g.globalAlpha = 1;
    }
  } else {
    const y = H * 0.55, x0 = W * 0.1, x1 = W * 0.9, step = (x1 - x0) / Math.max(1, n - 1);
    g.beginPath(); g.moveTo(x0, y); g.lineTo(x0 + (x1 - x0) * draw, y); g.stroke();
    for (let k = 0; k < n; k++) {
      const it = items[k], at = 0.35 + k * 0.45, p = easeBack(seg(t, at, at + 0.45)), a = clamp(seg(t, at, at + 0.3));
      const x = x0 + step * k, last = k === n - 1;
      g.fillStyle = last ? TH.accent : TH.ink;
      g.beginPath(); g.arc(x, y, Math.max(0, 20 * S * p), 0, Math.PI * 2); g.fill();
      g.globalAlpha = a; g.textAlign = "center";
      const lp = fitText(it.label, TH.num_font, step * 0.95, 84 * S, 36 * S);
      g.fillStyle = last ? TH.accent : TH.ink; g.font = font(lp, TH.num_font);
      g.fillText(it.label, x, y - 50 * S - (1 - a) * 30 * S);
      if (it.text) {
        const tp = fitText(it.text, TH.label_font, step * 0.95, 44 * S, 22 * S);
        g.fillStyle = TH.ink2; g.font = font(tp, TH.label_font); g.fillText(it.text, x, y + 90 * S);
      }
      g.globalAlpha = 1;
    }
  }
}

function scale(t, top) {
  const items = DATA.items, n = items.length;
  const max = Math.max(...items.map(i => i.value));
  const yTop = top + 130 * S, yBot = (PORTRAIT ? H * 0.88 : H * 0.92) - 100 * S;   // room for value + label text
  const cy = (yTop + yBot) / 2;
  const total = items.reduce((s, i) => s + i.value, 0);
  const unit = Math.min((W * 0.84 - (n - 1) * 40 * S) / total, (yBot - yTop) / max);   // true to scale, fits
  let x = W / 2 - (total * unit + (n - 1) * 40 * S) / 2;
  for (let k = 0; k < n; k++) {
    const it = items[k], at = 0.35 + k * 0.55, p = easeBack(seg(t, at, at + 0.7)), a = clamp(seg(t, at, at + 0.4));
    const d = Math.max(8 * S, it.value * unit), r = d / 2 * p, cx = x + d / 2, big = it.value === max;
    const grd = g.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.1, cx, cy, Math.max(r, 1));
    grd.addColorStop(0, big ? TH.accent2 : TH.muted2); grd.addColorStop(1, big ? TH.accent : TH.muted);
    g.fillStyle = grd; g.beginPath(); g.arc(cx, cy, Math.max(r, 0.5), 0, Math.PI * 2); g.fill();
    g.globalAlpha = a; g.textAlign = "center"; g.fillStyle = TH.ink;
    const lp = fitText(it.label, TH.label_font, Math.max(d, 220 * S), 54 * S, 26 * S);
    g.font = font(lp, TH.label_font); g.fillText(it.label, cx, cy + d / 2 + 70 * S);
    if (it.text) {
      const tp = fitText(it.text, TH.num_font, Math.max(d, 240 * S), 84 * S, 34 * S);
      g.fillStyle = big ? TH.accent_ink : TH.ink; g.font = font(tp, TH.num_font);
      g.fillText(counted(it.text, a), cx, cy - d / 2 - 30 * S);
    }
    g.globalAlpha = 1;
    x += d + 40 * S;
  }
}

// Depth dive (23 Nov, ocean stories): the camera sinks from the surface to the spoken depth past real landmarks
// (names only: the screen never shows a number the narrator didn't say). The gauge climbs to the spoken depth like a
// dive computer; the water darkens through the real light zones (NOAA: sunlight to ~200 m, twilight to ~1,000 m).
const ZONES = [[0, [70, 175, 232]], [200, [14, 74, 134]], [1000, [6, 24, 52]], [4000, [2, 7, 16]], [11000, [0, 1, 4]]];
const frac = x => x - Math.floor(x);
const easeInOut = x => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };

function water(m) {
  m = Math.max(0, m);
  for (let i = 1; i < ZONES.length; i++) {
    if (m <= ZONES[i][0]) {
      const [m0, c0] = ZONES[i - 1], [m1, c1] = ZONES[i], k = (m - m0) / (m1 - m0);
      return `rgb(${c0.map((v, j) => Math.round(v + (c1[j] - v) * k)).join(",")})`;
    }
  }
  return "rgb(0,1,4)";
}

function depth(t) {
  const it = DATA.items[0], target = it.value;
  const t0 = 0.2, t1 = Math.max(t0 + 1.2, T - 1.0), gp = seg(t, t0, t1), p = easeInOut(gp);
  const span = Math.max(target * 0.5, 24);                 // metres from the top of the frame to the bottom
  const cam = -span * 0.1 + (target + span * 0.1) * p;     // starts just above the surface, ends on the target
  const gy = PORTRAIT ? H * 0.2 : H * 0.18;                // the gauge's line (landmark names keep clear of it)
  const y = m => H * 0.5 + (m - cam) / span * H;
  const top = cam - span / 2, bot = cam + span / 2;
  const grd = g.createLinearGradient(0, 0, 0, H);          // the water, coloured by its real depth
  for (let k = 0; k <= 6; k++) grd.addColorStop(k / 6, water(top + (bot - top) * k / 6));
  g.fillStyle = grd; g.fillRect(0, 0, W, H);
  const ys = y(0);
  if (ys > 0) {                                             // sky and the surface while they are in view
    const sky = g.createLinearGradient(0, 0, 0, ys);
    sky.addColorStop(0, "#9fd3f2"); sky.addColorStop(1, "#e3f4fc");
    g.fillStyle = sky; g.fillRect(0, 0, W, ys);
    g.fillStyle = "rgba(255,255,255,0.85)";
    for (let x = 0; x < W; x += 6 * S) g.fillRect(x, ys - 3 * S + Math.sin(x / (40 * S) + t * 3) * 3 * S, 6 * S, 5 * S);
  }
  const rays = clamp(1 - Math.max(0, cam) / 200) * 0.18;   // sun rays fade out by ~200 m
  for (let k = 0; rays > 0.005 && k < 5; k++) {
    const x = W * (0.12 + 0.18 * k) + Math.sin(t * 0.7 + k) * 20 * S, y0 = Math.max(0, ys);
    const rg = g.createLinearGradient(x, y0, x + W * 0.12, H);
    rg.addColorStop(0, `rgba(220,245,255,${rays})`); rg.addColorStop(1, "rgba(220,245,255,0)");
    g.fillStyle = rg; g.beginPath(); g.moveTo(x, y0); g.lineTo(x + W * 0.05, y0);
    g.lineTo(x + W * 0.2, H); g.lineTo(x + W * 0.08, H); g.closePath(); g.fill();
  }
  for (let i = 0; i < 140; i++) {                           // marine snow drifting up past the camera (fixed seeds)
    const a = frac(Math.sin((i + 1) * 12.9898) * 43758.5453), b = frac(Math.sin((i + 5) * 78.233) * 24634.6345);
    const c = frac(Math.sin((i + 9) * 39.3468) * 11135.1137), yy = frac(b - cam / span * (0.7 + c * 0.6)) * H;
    if (yy < ys) continue;
    g.fillStyle = `rgba(230,240,255,${0.18 + c * 0.35})`;
    g.fillRect(a * W, yy, (1.5 + c * 2.5) * S, (1.5 + c * 2.5) * S);
  }
  const lx = W * 0.1;                                       // the dive line
  g.fillStyle = "rgba(255,255,255,0.25)"; g.fillRect(lx - 2 * S, Math.max(0, ys), 4 * S, H);
  g.textAlign = "right"; g.textBaseline = "alphabetic";
  for (const mk of DATA.marks || []) {                      // the landmarks we pass, above the target only
    const yy = y(mk.m);
    if (mk.m >= target * 0.97 || yy < -60 * S || yy > H + 60 * S) continue;
    g.strokeStyle = "rgba(255,255,255,0.35)"; g.lineWidth = 2 * S; g.setLineDash([14 * S, 12 * S]);
    g.beginPath(); g.moveTo(lx, yy); g.lineTo(W * 0.92, yy); g.stroke(); g.setLineDash([]);
    const lp = fitText(mk.label, TH.label_font, W * 0.62, 46 * S, 24 * S);
    const clear = clamp((Math.abs(yy - 18 * S - (gy - 50 * S)) - 90 * S) / (60 * S));   // fades near the gauge
    g.font = font(lp, TH.label_font); g.fillStyle = `rgba(255,255,255,${0.85 * clear})`;
    g.fillText(mk.label, W * 0.92, yy - 18 * S);
  }
  const yt = y(target);                                     // the place itself: a glowing ring and its name
  if (yt < H + 120 * S) {
    const glow = 0.6 + 0.4 * Math.sin(t * 4);
    const rg = g.createRadialGradient(W * 0.5, yt, 4 * S, W * 0.5, yt, 120 * S);
    rg.addColorStop(0, TH.accent2); rg.addColorStop(0.25, TH.accent); rg.addColorStop(1, "rgba(0,0,0,0)");
    g.globalAlpha = 0.55 * glow + 0.25; g.fillStyle = rg;
    g.beginPath(); g.arc(W * 0.5, yt, 120 * S, 0, Math.PI * 2); g.fill(); g.globalAlpha = 1;
    g.strokeStyle = TH.accent_ink; g.lineWidth = 6 * S; g.beginPath(); g.arc(W * 0.5, yt, 34 * S, 0, Math.PI * 2); g.stroke();
    g.textAlign = "center";
    const lp = fitText(it.label, TH.label_font, W * 0.8, 64 * S, 30 * S);
    g.font = font(lp, TH.label_font); g.fillStyle = "#F4F8FF"; g.fillText(it.label, W * 0.5, yt + 110 * S);
  }
  const show = clamp(seg(cam, span * 0.02, span * 0.12));  // the gauge appears once we are under water
  if (show > 0) {                                           // and climbs to the spoken depth as the dive ends
    const gauge = counted(it.text, p).toUpperCase();
    const vp = fitText(gauge, TH.num_font, W * 0.8, 150 * S, 60 * S);
    g.globalAlpha = show; g.textAlign = "center"; g.font = font(vp, TH.num_font);
    g.fillStyle = gp >= 1 ? TH.accent_ink : "#F4F8FF"; g.shadowColor = "rgba(0,0,0,0.6)"; g.shadowBlur = 18 * S;
    g.fillText(gauge, W * 0.5, gy); g.shadowBlur = 0; g.globalAlpha = 1;
  }
}

// Map (23 Nov, P3b picture-free scenes; the "where on Earth" globe dive of documentary and explainer channels): the
// globe turns to the place the narrator names, dives in and drops a pin with its name. Land, lakes and borders:
// Natural Earth 1:50m (public domain), simplified; our own orthographic projection. Names only, no coordinates on
// screen (the screen never shows a number the narrator didn't say).
const DEG = Math.PI / 180;
const HI = /[ऀ-ॿ]/;
let GEO = null, SCRATCH = new Float64Array(2);

function _lighten(hex, k) {
  const h = hex.replace("#", ""), c = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
  return "#" + c.map(x => Math.round(x + (255 - x) * k).toString(16).padStart(2, "0")).join("");
}

function geo() {
  if (GEO) return GEO;
  const q = DATA.world.q;
  const pack = pts => {                                     // [lon, lat] degrees -> sin/cos per point (no trig per frame)
    const out = new Float64Array(pts.length * 4);
    pts.forEach(([lo, la], i) => {
      out[4 * i] = Math.sin(lo * DEG); out[4 * i + 1] = Math.cos(lo * DEG);
      out[4 * i + 2] = Math.sin(la * DEG); out[4 * i + 3] = Math.cos(la * DEG);
    });
    return out;
  };
  const decode = list => list.map(arr => {                  // delta-encoded, quantized rings
    const pts = []; let x = 0, y = 0;
    for (let i = 0; i < arr.length; i += 2) { x += arr[i]; y += arr[i + 1]; pts.push([x / q, y / q]); }
    const p = pack(pts), ll = new Float32Array(pts.length * 2), box = [1e9, -1e9, 1e9, -1e9];
    pts.forEach(([lo, la], i) => {
      ll[2 * i] = lo; ll[2 * i + 1] = la;
      box[0] = Math.min(box[0], lo); box[1] = Math.max(box[1], lo); box[2] = Math.min(box[2], la); box[3] = Math.max(box[3], la);
    });
    p.ll = ll; p.box = box;
    return p;
  });
  const grat = [];
  for (let lon = -180; lon < 180; lon += 15) { const p = []; for (let la = -84; la <= 84; la += 3) p.push([lon, la]); grat.push(pack(p)); }
  for (let la = -75; la <= 75; la += 15) { const p = []; for (let lon = -180; lon <= 180; lon += 3) p.push([lon, la]); grat.push(pack(p)); }
  GEO = { land: decode(DATA.world.land), lakes: decode(DATA.world.lakes || []), borders: decode(DATA.world.borders),
          states: decode(DATA.world.states || []), rivers: decode(DATA.world.rivers || []), grat };
  let longest = 2;
  for (const a of GEO.land.concat(GEO.lakes)) longest = Math.max(longest, a.length / 4);
  SCRATCH = new Float64Array(longest * 2);
  return GEO;
}

// orthographic projection of point i of a packed list: [x, y, z]; z < 0 = behind the globe
function projector(v) {
  const sl0 = Math.sin(v.lam0), cl0 = Math.cos(v.lam0), sp0 = Math.sin(v.phi0), cp0 = Math.cos(v.phi0), o = [0, 0, 0];
  return (a, i) => {
    const sl = a[4 * i], cl = a[4 * i + 1], sp = a[4 * i + 2], cp = a[4 * i + 3];
    const sdl = sl * cl0 - cl * sl0, cdl = cl * cl0 + sl * sl0;
    o[0] = cp * sdl; o[1] = cp0 * sp - sp0 * cp * cdl; o[2] = sp0 * sp + cp0 * cp * cdl;
    return o;
  };
}

function inRing(ll, lon, lat) {                             // point in a lon/lat ring (Natural Earth cuts at 180)
  let inside = false;
  for (let i = 0, j = ll.length / 2 - 1; i < ll.length / 2; j = i++) {
    const xi = ll[2 * i], yi = ll[2 * i + 1], xj = ll[2 * j], yj = ll[2 * j + 1];
    if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

// Filled areas: points behind the globe hug its edge. A ring that also holds the point straight behind the globe
// (the antipode) then wraps the whole edge and would paint the sea as land (the Americas seen from Asia), so one
// extra edge circle flips it back under the even-odd rule.
function areaPath(rings, v) {
  const P = projector(v), m = 60 * S;
  const aLon = ((v.lam0 / DEG + 720) % 360) - 180, aLat = -v.phi0 / DEG;   // the point straight behind
  let flips = 0;
  g.beginPath();
  for (const a of rings) {
    const n = a.length / 4;
    let front = 0, x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (let i = 0; i < n; i++) {
      const o = P(a, i);
      let x = o[0], y = o[1];
      if (o[2] < 0) { const h = Math.hypot(x, y) || 1; x /= h; y /= h; } else front++;
      const X = v.cx + v.R * x, Y = v.cy - v.R * y;
      SCRATCH[2 * i] = X; SCRATCH[2 * i + 1] = Y;
      if (X < x0) x0 = X; if (X > x1) x1 = X; if (Y < y0) y0 = Y; if (Y > y1) y1 = Y;
    }
    if (!front || x1 < -m || x0 > W + m || y1 < -m || y0 > H + m) continue;
    const b = a.box;
    if (front < n && aLon >= b[0] && aLon <= b[1] && aLat >= b[2] && aLat <= b[3] && inRing(a.ll, aLon, aLat)) flips++;
    g.moveTo(SCRATCH[0], SCRATCH[1]);
    for (let i = 1; i < n; i++) g.lineTo(SCRATCH[2 * i], SCRATCH[2 * i + 1]);
    g.closePath();
  }
  if (flips % 2) { g.moveTo(v.cx + v.R, v.cy); g.arc(v.cx, v.cy, v.R, 0, Math.PI * 2); g.closePath(); }
}

function linePath(lines, v) {                               // lines: only the parts on the visible side
  const P = projector(v);
  g.beginPath();
  for (const a of lines) {
    let pen = false;
    for (let i = 0; i < a.length / 4; i++) {
      const o = P(a, i);
      if (o[2] < 0.02) { pen = false; continue; }
      const X = v.cx + v.R * o[0], Y = v.cy - v.R * o[1];
      if (pen) g.lineTo(X, Y); else { g.moveTo(X, Y); pen = true; }
    }
  }
}

function landInFrame(v) {                                   // does any coast or island show in the middle of the frame?
  const P = projector(v);
  for (const a of geo().land) {
    for (let i = 0; i < a.length / 4; i++) {
      const o = P(a, i);
      if (o[2] <= 0) continue;
      const X = v.cx + v.R * o[0], Y = v.cy - v.R * o[1];
      if (X > W * 0.08 && X < W * 0.92 && Y > H * 0.08 && Y < H * 0.92) return true;
    }
  }
  return false;
}

let SPAN = null;
function finalSpan(it) {                                    // an ocean place alone is a blank frame: widen until land shows
  if (SPAN !== null) return SPAN;
  const base = Math.max(300, it.span_km || 1500);
  SPAN = base * 4.5;
  for (const k of [1, 1.7, 2.8, 4.5]) {
    const v = { lam0: it.lon * DEG, phi0: it.lat * DEG, R: W * 6371 / (base * k), cx: W / 2, cy: H * (PORTRAIT ? 0.42 : 0.44) };
    if (landInFrame(v)) { SPAN = base * k; break; }
  }
  return SPAN;
}

function mapView(t) {                                       // where the camera is at time t
  const it = DATA.items[0], lamT = it.lon * DEG, phiT = it.lat * DEG;
  const arrive = Math.min(T * 0.72, 3.4);                   // long beats hold on the pin instead of a slower spin
  const pr = easeInOut(seg(t, 0, arrive * 0.85)), pz = easeInOut(seg(t, arrive * 0.2, arrive));
  const lamS = lamT + 80 * DEG, phiS = Math.max(-25 * DEG, Math.min(25 * DEG, phiT * 0.4));
  const R0 = Math.min(W, H) * 0.43, R1 = Math.max(R0, W * 6371 / finalSpan(it));
  return { lam0: lamS + (lamT - lamS) * pr, phi0: phiS + (phiT - phiS) * pr, R: R0 * Math.pow(R1 / R0, pz),
           cx: W / 2, cy: H * (PORTRAIT ? 0.42 : 0.44), pz, arrive };
}

function map(t) {
  const it = DATA.items[0], G = geo(), v = mapView(t), arrive = v.arrive;
  background(t);
  const halo = clamp(1 - v.pz * 1.6);                       // the atmosphere glow while the whole globe shows
  if (halo > 0) {
    const hg = g.createRadialGradient(v.cx, v.cy, v.R * 0.96, v.cx, v.cy, v.R * 1.18);
    hg.addColorStop(0, TH.sheen.replace(/[\d.]+\)$/, `${(0.35 * halo).toFixed(3)})`)); hg.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = hg; g.beginPath(); g.arc(v.cx, v.cy, v.R * 1.18, 0, Math.PI * 2); g.fill();
  }
  const sea = g.createRadialGradient(v.cx - v.R * 0.35, v.cy - v.R * 0.4, v.R * 0.05, v.cx, v.cy, v.R);
  sea.addColorStop(0, _lighten(TH.bg2, 0.12)); sea.addColorStop(0.7, TH.bg2); sea.addColorStop(1, TH.bg);
  g.save(); g.beginPath(); g.arc(v.cx, v.cy, v.R, 0, Math.PI * 2); g.fillStyle = sea; g.fill(); g.clip();
  g.strokeStyle = TH.ink; g.globalAlpha = 0.07; g.lineWidth = 1.5 * S; linePath(G.grat, v); g.stroke();
  g.globalAlpha = 1;
  areaPath(G.land, v); g.fillStyle = TH.muted2; g.fill("evenodd");
  g.strokeStyle = TH.ink2; g.globalAlpha = 0.45; g.lineWidth = 1.6 * S; g.stroke(); g.globalAlpha = 1;
  const near = clamp((v.pz - 0.45) / 0.35);                 // rivers and state lines once we are close
  if (near > 0) {
    g.strokeStyle = _lighten(TH.bg2, 0.18); g.globalAlpha = 0.75 * near; g.lineWidth = 2.2 * S; g.lineJoin = "round";
    linePath(G.rivers, v); g.stroke();
    g.strokeStyle = TH.ink; g.globalAlpha = 0.22 * near; g.lineWidth = 1.3 * S; g.setLineDash([3 * S, 6 * S]);
    linePath(G.states, v); g.stroke(); g.setLineDash([]); g.globalAlpha = 1;
  }
  areaPath(G.lakes, v); g.fillStyle = sea; g.fill("evenodd");
  g.strokeStyle = TH.ink; g.globalAlpha = 0.32; g.lineWidth = 1.6 * S; g.setLineDash([9 * S, 6 * S]);
  linePath(G.borders, v); g.stroke(); g.setLineDash([]); g.globalAlpha = 1;
  const limb = g.createRadialGradient(v.cx, v.cy, v.R * 0.55, v.cx, v.cy, v.R);   // the round shade of a sphere
  limb.addColorStop(0, "rgba(0,0,0,0)"); limb.addColorStop(1, "rgba(0,0,0,0.45)");
  g.fillStyle = limb; g.fillRect(0, 0, W, H);
  g.restore();
  const t0 = arrive * 0.86, drop = seg(t, t0, t0 + 0.35), py = v.cy - (1 - easeBack(drop)) * 160 * S;
  if (drop > 0) {                                           // the pin lands on the place and keeps pulsing
    for (let k = 0; k < 2; k++) {
      const since = t - t0 - 0.3 - k * 0.7;
      if (since < 0) continue;
      const ph = (since / 1.4) % 1;
      g.strokeStyle = TH.accent; g.globalAlpha = 0.7 * (1 - ph); g.lineWidth = 5 * S;
      g.beginPath(); g.arc(v.cx, v.cy, 20 * S + ph * 110 * S, 0, Math.PI * 2); g.stroke();
    }
    g.globalAlpha = clamp(drop * 3);
    const gl = g.createRadialGradient(v.cx, py, 2 * S, v.cx, py, 70 * S);
    gl.addColorStop(0, TH.accent2); gl.addColorStop(0.35, TH.accent); gl.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = gl; g.beginPath(); g.arc(v.cx, py, 70 * S, 0, Math.PI * 2); g.fill();
    g.fillStyle = TH.accent; g.beginPath(); g.arc(v.cx, py, 18 * S, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#FFFFFF"; g.beginPath(); g.arc(v.cx, py, 7 * S, 0, Math.PI * 2); g.fill();
    g.globalAlpha = 1;
  }
  const a = easeOut(seg(t, arrive * 0.95, arrive * 0.95 + 0.45));
  if (a > 0) {                                              // the name, as the narrator says it, and where it is
    const hindi = HI.test(it.label + (it.text || "")), name = hindi ? it.label : it.label.toUpperCase();
    const cw = W * 0.82, top = v.cy + (PORTRAIT ? 190 : 120) * S + (1 - a) * 40 * S;
    const np = fitText(name, TH.title_font, cw - 70 * S, 96 * S, 44 * S);
    const sp = it.text ? fitText(it.text, TH.label_font, cw - 70 * S, 46 * S, 24 * S) : 0;
    const ch = np * 1.05 + (it.text ? sp * 1.5 : 0) + 56 * S, x = W / 2 - cw / 2;
    g.globalAlpha = a; g.strokeStyle = TH.accent; g.lineWidth = 3 * S;
    g.beginPath(); g.moveTo(v.cx, v.cy + 24 * S); g.lineTo(v.cx, top); g.stroke();
    g.fillStyle = TH.bg; g.globalAlpha = 0.86 * a; roundRect(x, top, cw, ch, 18 * S); g.fill();
    g.globalAlpha = a; g.fillStyle = TH.accent; g.fillRect(x, top, 12 * S, ch);
    g.textAlign = "center"; g.textBaseline = "alphabetic"; g.fillStyle = TH.ink;
    g.font = font(np, TH.title_font); g.fillText(name, W / 2 + 6 * S, top + 28 * S + np * 0.9);
    if (it.text) {
      g.fillStyle = TH.ink2; g.font = font(sp, TH.label_font);
      g.fillText(it.text, W / 2 + 6 * S, top + 28 * S + np * 1.05 + sp * 1.15);
    }
    g.globalAlpha = 1;
  }
}

window.draw = function (t) {
  const zoom = 1 + 0.025 * (t / T);                           // slow push-in, like a camera
  g.setTransform(zoom, 0, 0, zoom, -(zoom - 1) * W / 2, -(zoom - 1) * H / 2);
  if (DATA.type === "depth") {
    depth(t);                                               // paints its own water; the gauge is its headline
  } else if (DATA.type === "map") {
    map(t);                                                 // the globe dive; the place card is its headline
  } else {
    background(t);
    const top = title(t);
    ({ compare, timeline, scale })[DATA.type](t, top || H * 0.12);
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
  return true;
};
window.ready = document.fonts.ready.then(() => { window.draw(0); return true; });
</script></body></html>
